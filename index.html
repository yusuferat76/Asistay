<!doctype html>
<html lang="tr">
  <head>
    <script>
      (function() {
        const suppressPatterns = [
          'WebSocket', 'vite', 'HMR', 'closed without opened', 
          'connection', 'failed', 'refused', 'status 504'
        ];
        
        const suppress = (msg) => {
          if (!msg) return false;
          const s = String(typeof msg === 'string' ? msg : (msg.message || '')).toLowerCase();
          return suppressPatterns.some(p => s.includes(p.toLowerCase()));
        };
        
        const _error = console.error;
        console.error = (...args) => {
          if (suppress(args[0]) || (args[0] && suppress(args[0].message))) return;
          _error.apply(console, args);
        };

        const _warn = console.warn;
        console.warn = (...args) => {
          if (suppress(args[0]) || (args[0] && suppress(args[0].message))) return;
          _warn.apply(console, args);
        };

        window.addEventListener('error', (event) => {
          if (suppress(event.message) || suppress(event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          if (event.reason && suppress(event.reason.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Ultimate Silent WebSocket Proxy with EventTarget interface
        const OriginalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || url.includes('ais-dev-'))) {
            const listeners = new Map();
            const mock = {
              url,
              readyState: 1, // OPEN
              protocol: '',
              extensions: '',
              bufferedAmount: 0,
              binaryType: 'blob',
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
              close: function() { this.readyState = 3; },
              send: function() {},
              addEventListener: function(type, listener) {
                if (!listeners.has(type)) listeners.set(type, new Set());
                listeners.get(type).add(listener);
                if (type === 'open') {
                  setTimeout(() => {
                    try {
                      listener.call(this, new Event('open'));
                    } catch(e) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, listener) {
                if (listeners.has(type)) {
                  listeners.get(type).delete(listener);
                }
              },
              dispatchEvent: function(event) {
                const set = listeners.get(event.type);
                if (set) {
                  set.forEach(fn => {
                    try { fn.call(this, event); } catch(e) {}
                  });
                }
                return true;
              }
            };

            setTimeout(() => {
              try {
                if (typeof mock.onopen === 'function') {
                  mock.onopen(new Event('open'));
                }
              } catch(e) {}
            }, 0);

            return mock;
          }
          try {
            return new OriginalWebSocket(url, protocols);
          } catch (e) {
            return { readyState: 3, close: () => {}, send: () => {}, addEventListener: () => {}, removeEventListener: () => {}, dispatchEvent: () => true };
          }
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      })();
    </script>
